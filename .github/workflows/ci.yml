name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package anaglyph --extra dev
      - name: Ruff lint
        run: uv run --no-sync --no-build ruff check main.py camera_manager.py calibration.py gui.py compositor.py video_recorder.py tests/
      - name: Ruff format check
        run: uv run --no-sync --no-build ruff format --check main.py camera_manager.py calibration.py gui.py compositor.py video_recorder.py tests/
      - name: Mypy (informational)
        run: uv run --no-sync --no-build mypy main.py camera_manager.py calibration.py gui.py --ignore-missing-imports || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 >/dev/null
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --no-build --no-binary-package anaglyph --extra dev
      - name: Run unit and integration tests
        run: uv run --no-sync --no-build pytest tests/ -v -m "not hardware" --tb=short

  guards:
    name: Sonar mechanical guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run Python guards
        run: python scripts/sonar_guard.py main.py camera_manager.py calibration.py gui.py compositor.py video_recorder.py tests
      - name: Run workflow guards
        run: python scripts/sonar_guard.py --workflows .github/workflows

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v6
        with:
          enable-cache: true
      - name: Lint workflows
        run: uvx --no-build --from zizmor==1.29.0 zizmor --no-progress .github/workflows/ci.yml

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: test
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
